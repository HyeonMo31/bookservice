<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/header :: header"> </head>
  <body>
    <div class="container heightCal">
      <div th:replace="fragments/bodyHeader :: bodyHeader" />
      <div class="container" style="margin-top: 150px">
        <h1 class="text-center mb-4">무슨 책을 찾으시나요?</h1>
        <div class="container d-flex justify-content-center">
          <div
            class="p-1 bg-light rounded rounded-pill shadow-sm mb-5"
            style="width: 60%"
          >
            <form th:action="@{/search/books}" , method="get">
              <div class="input-group">
                <input
                  type="search"
                  name="query"
                  placeholder="What're you searching for?"
                  aria-describedby="button-addon1"
                  class="form-control border-0 bg-light"
                />
                <div class="input-group-append">
                  <button
                    id="button-addon1"
                    type="submit"
                    class="btn btn-link text-primary"
                  >
                    <i class="fa fa-search"></i>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
        <h5 class="text-center">Trending now</h5>
        <div class="d-flex gap-2 justify-content-center py-5">
          <button
            onclick="location.href='/search/books?query=정보처리기사'"
            class="btn btn-primary rounded-pill px-3"
            type="button"
          >
            정보처리기사
          </button>
          <button
            onclick="location.href='/search/books?query=요리'"
            class="btn btn-secondary rounded-pill px-3"
            type="button"
          >
            요리
          </button>
          <button
            onclick="location.href='/search/books?query=고양이'"
            class="btn btn-success rounded-pill px-3"
            type="button"
          >
            고양이
          </button>
          <button
            onclick="location.href='/search/books?query=자기계발'"
            class="btn btn-danger rounded-pill px-3"
            type="button"
          >
            자기계발
          </button>
          <button
            onclick="location.href='/search/books?query=컴퓨터공학'"
            class="btn btn-warning rounded-pill px-3"
            type="button"
          >
            컴퓨터공학
          </button>
          <button
            onclick="location.href='/search/books?query=데이터베이스'"
            class="btn btn-info rounded-pill px-3"
            type="button"
          >
            데이터베이스
          </button>
          <button
            onclick="location.href='/search/books?query=백엔드'"
            class="btn btn-light rounded-pill px-3"
            type="button"
          >
            백엔드
          </button>
          <button
            onclick="location.href='/search/books?query=스프링부트'"
            class="btn btn-dark rounded-pill px-3"
            type="button"
          >
            스프링부트
          </button>
        </div>
      </div>
    </div>
    <div th:replace="fragments/footer :: footer"></div>
  </body>
  <script
    src="https://kit.fontawesome.com/5f234ab63e.js"
    crossorigin="anonymous"
  ></script>
</html>
