      <div class="container heightCal">

        <div class="container px-4 px-lg-5 my-5">
          <div class="row gx-4 gx-lg-5 align-items-center">
            <div class="col-md-3">
              <img

            </div>
            <div class="col-md-9">
              <div class="small mb-1">
                <span>ISBN : </span>
                <span id="isbn"></span>
              </div>
              <h1 id="title" class="display-9 fw-bolder">Shop item template</h1>
              <div class="fs-6 mb-1">
                <span>저자 : </span>
                <span id="author" class="fw-bolder"></span>
              </div>
              <div class="fs-6 mb-2">
                <span>출판사 : </span>
                <span id="publisher" class="fw-bolder"></span>
              </div>
              <div class="fs-6 mb-2">
                <span>가격 : </span>
                <span id="price" class="fw-bolder"></span>
              </div>
              <div class="fs-6 mb-2">
                <span>출간일 : </span>
                <span id="pubdate" class="fw-bolder"></span>
              </div>
              <div class="d-flex">
                <button
                  id="bookMarkButton"
                  class="btn btn-outline-dark flex-shrink-0"
                  type="submit"
                >
                  즐겨찾기 추가
                </button>
              </div>
              <p id="description" class="lead fs-6"></p>
            </div>
          </div>
        </div>
      </div>
      <div class="container">
        <div class="row bootstrap snippets bootdeys">
          <div class="col-md-12 col-sm-12">
            <div class="comment-wrapper">
              <div class="panel panel-info">
                <div class="panel-heading">나의 생각</div>
                <div class="panel-body">
                  <div>
                    <textarea
                      maxlength="255"
                      sec:authorize="isAuthenticated()"
                      id="review"
                      class="form-control"
                      placeholder="나의 생각을 남겨보세요."
                      rows="3"
                    ></textarea>
                    <textarea
                      sec:authorize="isAnonymous()"
                      disabled
                      th:sec
                      name="review"
                      class="form-control"
                      placeholder="로그인 하십시오."
                      rows="3"
                    ></textarea>
                    <br />
                    <button
                      sec:authorize="isAuthenticated()"
                      id="addReview"
                      type="submit"
                      class="btn btn-info pull-right"
                    >
                      Post
                    </button>
                  </div>
                  <div class="clearfix"></div>
                  <hr />
                  <ul id="reviewList" class="media-list"></ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div th:replace="fragments/footer :: footer"></div>

      const url = new URL(window.location.href);
      const reviewList = document.getElementById("reviewList");
      const bookMarkButton = document.getElementById("bookMarkButton");
      const isbn = url.pathname.split("/").pop();

      async function fetchData(url) {
        try {
          const response = await fetch(url);
          const data = await response.json();
          if (!response.ok) {
            handleFetchError(data);
            return;
          }
          return data;
        } catch (error) {
          console.error("Error fetching data:", error);
          throw error;
        }
      }

      function handleFetchError(data) {
        if (data.code === 404) {
          alert("잘못된 접근입니다.");
          window.location.href = "/";
        }
      }

      function updateElementById(id, content) {
        const element = document.getElementById(id);
        if (element) element.innerText = content;
      }

      function displayBook(book) {
        updateElementById("isbn", book.isbn);
        updateElementById("title", book.title);
        updateElementById("author", book.author);
        updateElementById("publisher", book.publisher);
        document.getElementById("image").src = book.image;
        updateElementById("description", book.description);
        updateElementById("price", book.price);
        updateElementById("pubdate", book.pubdate);
      }

      function displayReviews(reviews, member) {
        if (reviews.length === 0) {
          reviewList.innerHTML = `<h6 class="mt-5 text-center">등록 된 댓글이 존재하지 않습니다.</h6>`;
          return;
        }
        reviews.forEach((review) => {
          const reviewLi = document.createElement("li");
          reviewLi.id = review.id;
          reviewLi.className = "media";
          reviewLi.innerHTML = `
            <div class="media-body">
                <strong class="text-success">${review.name}</strong>
                <span class="text-muted pull-right">
                    <small class="text-muted">${review.writeDate}</small>
                </span>
                <p style="white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;">${review.text}</p>
                <div>
                    <button type="submit" class="btn btn-info pull-right deleteBtn">삭제</button>
                </div>
            </div>`;
          reviewList.appendChild(reviewLi);

          const deleteButton = reviewLi.querySelector(".deleteBtn");
          if (review.loginId !== member.loginId) {
            deleteButton.classList.add("hidden");
          }
        });
      }

      function updateBookMarkButton(bookMarked) {
        bookMarkButton.textContent = bookMarked
          ? "즐겨찾기 제거"
          : "즐겨찾기 추가";
      }

      async function handleBookMarkAction(method, successMessage) {
        try {
          const response = await fetch(`/api/books/${isbn}/bookmarks`, {
            method,
          });
          if (response.ok) {
            updateBookMarkButton(method === "POST");
          } else if (response.status === 401) {
            if (confirm("로그인이 필요 합니다.")) {
              window.location.href = "/login";
            }
          }
        } catch (error) {
          console.error(successMessage + " 중 오류가 발생했습니다.", error);
        }
      }

      function reviewSave() {
        const text = document.getElementById("review").value.trim();
        fetch(`/api/books/${isbn}/reviews`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ isbn, text }),
        })
          .then(() => window.location.reload())
          .catch((error) =>
            console.error("리뷰 저장 중 오류가 발생했습니다.", error)
          );
      }

      async function render() {
        const bookDataUrl = `/api/books/${isbn}`;
        const reviewDataUrl = `/api/books/${isbn}/reviews`;
        const loginMemberUrl = `/api/members`;
        const bookMarkUrl = `/api/books/${isbn}/bookmarks`;

        try {
          const [member, book, reviews, bookMark] = await Promise.all([
            fetchData(loginMemberUrl),
            fetchData(bookDataUrl),
            fetchData(reviewDataUrl),
            fetchData(bookMarkUrl),
          ]);

          displayBook(book);
          displayReviews(reviews, member);
          updateBookMarkButton(bookMark.message === "true");
        } catch (error) {
          console.error("데이터 렌더링 중 오류가 발생했습니다.", error);
        }
      }

      render();

      document
        .getElementById("addReview")
        ?.addEventListener("click", reviewSave);

      reviewList.addEventListener("click", function (event) {
        if (event.target.classList.contains("deleteBtn")) {
          const reviewItem = event.target.closest(".media");
          const reviewId = reviewItem.id;
          if (confirm("정말로 이 리뷰를 삭제하시겠습니까?")) {
            fetch(`/api/books/${isbn}/reviews/${reviewId}`, {
              method: "DELETE",
            })
              .then((response) => response.json())
              .then((data) => {
                alert(data.message);
                window.location.reload();
              })
              .catch((error) => {
                console.error("리뷰 삭제 중 오류가 발생했습니다.", error);
                alert("리뷰 삭제 중 오류가 발생했습니다.");
              });
          }
        }
      });

      bookMarkButton.addEventListener("click", function () {
        const isAdding = bookMarkButton.textContent.trim() === "즐겨찾기 추가";
        handleBookMarkAction(
          isAdding ? "POST" : "DELETE",
          isAdding ? "즐겨찾기 추가" : "즐겨찾기 제거"
        );
