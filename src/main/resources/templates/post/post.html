<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:replace="fragments/header :: header"> </head>
  <body>
    <div class="container heightCal">
      <div th:replace="fragments/bodyHeader :: bodyHeader"></div>
      <div class="blog-single gray-bg">
        <div class="container">
          <div class="row align-items-start">
            <div class="col-lg-3 m-15px-tb blog-aside">
              <!-- Author -->
              <div class="widget widget-author">
                <div class="widget-title">
                  <h3>토론 관련 책</h3>
                </div>
                <div class="container">
                  <img
                    id="bookImage"
                    style="width: 250px; height: 300px"
                    src="https://shopping-phinf.pstatic.net/main_3246655/32466555089.20221228071854.jpg"
                    title=""
                    alt=""
                  />
                  <div>
                    <a id="bookTitle" text="">책제목</a>
                  </div>
                  <div id="author">저자</div>
                  <div id="pubdate" text="">출간일</div>
                  <div id="isbn" text="'">isbn</div>
                </div>
              </div>
              <!-- End Author -->

              <!-- Trending Post -->
              <!-- <div class="widget widget-post">
                <div class="widget-title">
                  <h3>Trending Now</h3>
                </div>
                <div class="widget-body"></div>
              </div> -->
              <!-- End Trending Post -->

              <!-- Latest Post -->
              <div class="widget widget-latest-post">
                <div class="widget-title">
                  <h3>최신 게시글</h3>
                </div>
                <div id="postLatestContainer" class="widget-body"></div>
              </div>
              <!-- End Latest Post -->
            </div>
            <div class="col-lg-9 m-15px-tb">
              <article class="article">
                <div class="article-title">
                  <div class="media">
                    <div class="avatar">
                      <img
                        id="memberImage"
                        src="https://bootdey.com/img/Content/avatar/avatar1.png"
                        title=""
                        alt=""
                      />
                    </div>
                    <div class="media-body">
                      <div style="display: inline">
                        <label id="name" text="">작성자</label>
                        <span id="loginId" text="">(loginId)</span>
                      </div>
                      <span id="createdDate" text="">0000-00-00 00:00</span>
                    </div>
                  </div>
                  <h2 class="mt-3 text-break" id="postTitle" text="">
                    책 제목
                  </h2>
                </div>
                <div class="article-content">
                  <p
                    id="text"
                    class="text-break"
                    style="white-space: pre-wrap; min-height: 200px"
                    text=""
                  >
                    글 내용
                  </p>
                </div>
              </article>

              <div class="d-flex justify-content-end mb-3">
                <button id="postUpdateBtn" class="btn btn-primary btn-sm">
                  수정
                </button>
                <button id="postDeleteBtn" class="btn btn-primary btn-sm mx-2">
                  삭제
                </button>
              </div>

              <!--                    CommentForm-->
              <div
                class="bg-white rounded shadow-sm p-4 mb-5 rating-review-select-page"
              >
                <h5 class="mb-4">댓글 작성</h5>
                <form action="" method="post">
                  <div class="form-group">
                    <label>Your Comment</label>
                    <textarea
                      sec:authorize="isAuthenticated()"
                      maxlength="255"
                      id="comment"
                      name="comment"
                      class="form-control"
                      placeholder="댓글을 작성하십시오."
                      style="resize: none"
                      rows="3"
                    ></textarea>
                    <textarea
                      disabled
                      sec:authorize="isAnonymous()"
                      id="comment"
                      name="comment"
                      class="form-control"
                      placeholder="로그인 하십시오."
                      style="resize: none"
                      rows="3"
                    ></textarea>
                  </div>
                  <div class="form-group mt-3">
                    <button
                      id="addComment"
                      class="btn btn-primary btn-sm"
                      type="submit"
                    >
                      작성
                    </button>
                  </div>
                </form>
              </div>
              <!--                    CommentForm-->

              <!--                    CommentList-->
              <div id="commentContainer" class="container"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div th:replace="fragments/footer :: footer"></div>
  </body>
  <script th:inline="javascript">
    const url = new URL(window.location.href);
    const postId = url.pathname.split("/").pop();
    const postUpdateBtn = document.getElementById("postUpdateBtn");
    const postDeleteBtn = document.getElementById("postDeleteBtn");

    async function fetchData(url) {
      try {
        const response = await fetch(url);
        const data = await response.json();
        if (!response.ok) {
          handleFetchError(data);
          return;
        }
        return data;
      } catch (error) {
        console.error("Error fetching data:", error);
        throw error;
      }
    }

    function handleFetchError(data) {
      if (data.code === 404) {
        alert("글이 존재하지 않습니다.");
        history.back();
      }
    }

    async function render() {
      const postDataUrl = `/api/post/${postId}`;
      const postLatestDataUrl = `/api/post/latest`;
      const loginMemberUrl = `/api/members`;

      try {
        const [post, postLatest, member] = await Promise.all([
          fetchData(postDataUrl),
          fetchData(postLatestDataUrl),
          fetchData(loginMemberUrl),
        ]);

        displayLatest(postLatest);
        displayBook(post.bookInfo);
        displayPost(post, member);
        displayComments(post.commentsDto, member);
      } catch (error) {
        console.error("데이터 렌더링 중 오류가 발생했습니다.", error);
      }
    }

    function displayLatest(postLatest) {
      const container = document.getElementById("postLatestContainer");

      postLatest.forEach((post) => {
        const element = document.createElement("div");
        element.className = "latest-post-aside media";

        element.innerHTML = `<div class="lpa-left media-body">
                      <div class="lpa-title">
                        <h5>
                          <a href="/post/${post.id}"
                            >${post.postTitle}</a
                          >
                        </h5>
                      </div>
                      <div class="lpa-meta">
                        <a class="name"> ${post.name} </a>
                        <a class="date"> ${post.createdDate} </a>
                      </div>
                    </div>
                    <div class="lpa-right">
                      <a href="#">
                        <img
                          src="${post.bookImage}"
                          title=""
                          alt=""
                        />
                      </a>
                    </div>`;

        container.appendChild(element);
      });
    }

    function displayBook(book) {
      document.getElementById("bookImage").src = book.image;
      document.getElementById("bookTitle").textContent = book.bookTitle;
      document.getElementById("bookTitle").href = `/search/book/${book.isbn}`;
      document.getElementById("author").textContent = book.author;
      document.getElementById("pubdate").textContent = book.pubdate;
      document.getElementById("isbn").textContent = book.isbn;
    }

    function displayPost(data, member) {
      document.getElementById("memberImage").src = `/files/${data.memberImage}`;
      document.getElementById("name").textContent = data.name;
      document.getElementById("loginId").textContent = data.loginId;
      document.getElementById("createdDate").textContent = data.createdDate;
      document.getElementById("postTitle").textContent = data.postTitle;
      document.getElementById("text").textContent = data.text;

      if (data.loginId !== member.loginId) {
        postUpdateBtn.classList.add("hidden");
        postDeleteBtn.classList.add("hidden");
      }
    }

    function displayComments(comments, member) {
      const container = document.getElementById("commentContainer");
      if (comments.length === 0) {
        container.innerHTML = `<h6 class="mt-5 text-center">등록 된 댓글이 존재하지 않습니다.</h6>`;
        return;
      }

      comments.forEach((comment) => {
        const commentDiv = document.createElement("div");
        commentDiv.id = comment.id;
        commentDiv.className = "media g-mb-30 media-comment";
        commentDiv.innerHTML = `

                  <div  class="media-body u-shadow-v18 g-bg-secondary g-pa-30">
                    <div style="display:flex" class="g-mb-15">
                       <img
                    class="d-flex g-width-50 g-height-50 rounded-circle g-mt-3 g-mr-15"
                    src="/files/${comment.memberImage}"
                    alt="Image Description"
                  />
                  <div>
                      <h5
                        id="commentName"
                        text=""
                        class="fw-bold h5 g-color-gray-dark-v1 mb-0"
                      >
                    ${comment.name}
                      </h5>
                      <span
                        id="commentCreatedDate"
                        class="g-color-gray-dark-v4 g-font-size-12"
                        >
                    ${comment.createdDate}</span
                      >
                      </div>
                    </div>

                    <p
                      id="commentText"
                      style="white-space: pre-wrap"
                      class="text-break"
                    >${comment.text}
                    </p>
                    <div class = "d-flex justify-content-between">
                     <ul class="list-inline d-sm-flex my-0">
                      <li class="list-inline-item g-mr-20">
                        <a
                          class="u-link-v5 g-color-gray-dark-v4 g-color-primary--hover"
                          href="#!"
                        >
                          <i
                            class="fa fa-thumbs-up g-pos-rel g-top-1 g-mr-3"
                          ></i>
                          178
                        </a>
                      </li>
                      <li class="list-inline-item g-mr-20">
                        <a
                          class="u-link-v5 g-color-gray-dark-v4 g-color-primary--hover"
                          href="#!"
                        >
                          <i
                            class="fa fa-thumbs-down g-pos-rel g-top-1 g-mr-3"
                          ></i>
                          34
                        </a>
                      </li>
                      <li class="list-inline-item ml-auto">
                        <button
                        id="replyBtn-${comment.id}"
                          type=""
                          class="btn btn-primary btn-sm mx-2 replyBtn"
                        >
                          대댓글 작성
                        </button>
                      </li>     
                    </ul>
                    <div>
                        <button
                        id="deleteComment-${comment.id}"
                          type="submit"
                          class="btn btn-primary btn-sm mx-2 deleteBtn"
                        >
                          삭제
                        </button>
                      </div>
                    </div>
                    <form id=replyForm-${comment.id} action="" method="post"  style= "display:none;">
                    <div  class="form-group">
                      <label>Your Comment</label>
                      <textarea
                        maxlength="255"
                        id="replyComment-${comment.id}"
                        name="comment"
                        class="form-control"
                        placeholder="댓글을 작성하십시오."
                        style="resize: none"
                        rows="3"
                      ></textarea>
                    </div>
                    <div class="form-group mt-3">
                      <button
                        id="addComment"
                        class="btn btn-primary btn-sm addBtn"
                        type="submit"
                      >
                        작성
                      </button>
                    </div>
                </form>`;

        container.appendChild(commentDiv);
        const deleteButton = commentDiv.querySelector(".deleteBtn");
        if (comment.loginId !== member.loginId) {
          deleteButton.classList.add("hidden");
        }

        //자식 댓글 만들기;
        comment.children.forEach((child) => {
          const childDiv = document.createElement("div");
          childDiv.id = child.id;
          childDiv.className = "row d-flex media g-mb-30 media-comment";
          childDiv.innerHTML = `
          <div class = "col-2"></div>
          <div  class="col-10 media-body u-shadow-v18 g-bg-secondary g-pa-30">
                    <div style="display:flex" class="g-mb-15">
                       <img
                    class="d-flex g-width-50 g-height-50 rounded-circle g-mt-3 g-mr-15"
                    src="/files/${child.memberImage}"
                    alt="Image Description"
                  />
                  <div>
                      <h5
                        id="commentName"
                        text=""
                        class="fw-bold h5 g-color-gray-dark-v1 mb-0"
                      >
                    ${child.name}
                      </h5>
                      <span
                        id="commentCreatedDate"
                        class="g-color-gray-dark-v4 g-font-size-12"
                        >
                    ${child.createdDate}</span
                      >
                      </div>
                    </div>

                    <p
                      id="commentText"
                      style="white-space: pre-wrap"
                      class="text-break"
                    >${child.text}
                    </p>
                    <div class = "d-flex justify-content-between">
                     <ul class="list-inline d-sm-flex my-0">
                      <li class="list-inline-item g-mr-20">
                        <a
                          class="u-link-v5 g-color-gray-dark-v4 g-color-primary--hover"
                          href="#!"
                        >
                          <i
                            class="fa fa-thumbs-up g-pos-rel g-top-1 g-mr-3"
                          ></i>
                          178
                        </a>
                      </li>
                      <li class="list-inline-item g-mr-20">
                        <a
                          class="u-link-v5 g-color-gray-dark-v4 g-color-primary--hover"
                          href="#!"
                        >
                          <i
                            class="fa fa-thumbs-down g-pos-rel g-top-1 g-mr-3"
                          ></i>
                          34
                        </a>
                      </li>                  
                    </ul>
                    <div>
                        <button
                        id="deleteComment-${child.id}"
                          type="submit"
                          class="btn btn-primary btn-sm mx-2 deleteBtn"
                        >
                          삭제
                        </button>
                      </div>
                    </div>
                    `;

          container.appendChild(childDiv);
          const deleteButton = document.getElementById(
            `deleteComment-${child.id}`
          );
          if (child.loginId !== member.loginId) {
            deleteButton.classList.add("hidden");
          }
        });
      });
    }

    document.getElementById("postUpdateBtn").addEventListener("click", () => {
      window.location.href = `/post/update/${postId}`;
    });

    document.getElementById("postDeleteBtn").addEventListener("click", () => {
      if (confirm("정말 삭제하시겠습니까?")) {
        fetch(`/api/post/${postId}`, {
          method: "DELETE",
        })
          .then((response) => {
            return response.json().then((data) => {
              if (response.ok) {
                history.back();
              } else if (response.status == 401) {
                window.location.href = "/login";
              }
              alert(data.message);
            });
          })
          .catch((error) => alert(error.message));
      }
    });

    document.getElementById("addComment").addEventListener("click", () => {
      const text = document.getElementById("comment").value.trim();
      fetch(`/api/post/${postId}/comments`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ parentId: null, text }),
      })
        .then((response) => {
          return response.json().then((data) => {
            if (response.ok) {
              window.location.reload();
            } else if (response.status == 401) {
              window.location.href = "/login";
            } else if (response.status == 404) {
              history.back();
            }
            alert(data.message);
          });
        })
        .catch((error) => alert(error.message));
    });

    document
      .getElementById("commentContainer")
      .addEventListener("click", function (event) {
        const commentDiv = event.target.closest(".media");
        const commentId = commentDiv.id;

        if (event.target.classList.contains("deleteBtn")) {
          if (confirm("정말로 이 리뷰를 삭제하시겠습니까?")) {
            fetch(`/api/post/${postId}/comments/${commentId}`, {
              method: "DELETE",
            })
              .then((response) => {
                return response.json().then((data) => {
                  if (response.ok) {
                    window.location.reload();
                  } else if (response.status == 401) {
                    window.location.href = "/login";
                  } else if (response.status == 404) {
                    history.back();
                  }
                  alert(data.message);
                });
              })
              .catch((error) => alert(error.message));
          }
        } else if (event.target.classList.contains("replyBtn")) {
          const replyInput = document.getElementById(`replyForm-${commentId}`);

          if (replyInput.style.display === "none") {
            replyInput.style.display = "block";
          } else {
            replyInput.style.display = "none";
          }
        } else if (event.target.classList.contains("addBtn")) {
          const text = document
            .getElementById(`replyComment-${commentId}`)
            .value.trim();
          console.log(text);
          fetch(`/api/post/${postId}/comments`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ parentId: commentId, text: text }),
          })
            .then((response) => {
              return response.json().then((data) => {
                if (response.ok) {
                  window.location.reload();
                } else if (response.status == 401) {
                  window.location.href = "/login";
                } else if (response.status == 404) {
                  window.location.reload();
                }
                alert(data.message);
              });
            })
            .catch((error) => alert(error.message));
        }
      });

    render();
  </script>
</html>
