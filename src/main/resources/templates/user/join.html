<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/header :: header"> </head>
  <body>
    <div class="container heightCal">
      <div th:replace="fragments/bodyHeader :: bodyHeader"></div>
      <div class="container d-flex justify-content-center margin-top-100">
        <div class="col-md-7 col-lg-8">
          <h4 class="mb-3">회원가입</h4>
          <form
            th:action="@{/join}"
            th:object="${joinDto}"
            method="post"
            class="needs-validation"
            novalidate=""
            enctype="multipart/form-data"
          >
            <div class="row g-3">
              <div class="row g-3">
                <div class="col-2">
                  <label for="memberImage" class="form-label">유저 사진</label>
                  <img
                    id="previewImage"
                    style="height: 100px; width: 100px"
                    src="/../img/head.png"
                    alt="유저 이미지 미리보기"
                  />
                </div>
              </div>
              <div class="col-4">
                <input
                  type="file"
                  class="form-control"
                  id="memberImage"
                  th:field="*{memberImage}"
                  placeholder=""
                  value=""
                  required=""
                  th:errorclass="field-error"
                  maxlength="15"
                />
              </div>
              <div class="col-12">
                <label for="id" class="form-label">아이디</label>
                <input
                  type="text"
                  class="form-control"
                  id="id"
                  th:field="*{loginId}"
                  placeholder=""
                  value=""
                  required=""
                  th:errorclass="field-error"
                  maxlength="15"
                />
                <div class="field-error" th:errors="*{loginId}" />
              </div>

              <div class="col-12">
                <label for="name" class="form-label">이름</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  th:field="*{name}"
                  placeholder=""
                  required=""
                  th:errorclass="field-error"
                  maxlength="6"
                />
                <div class="field-error" th:errors="*{name}" />
              </div>

              <div class="col-12">
                <label for="city" class="form-label">도시</label>
                <input
                  type="text"
                  class="form-control"
                  id="city"
                  th:field="*{city}"
                  placeholder=""
                  required=""
                  th:errorclass="field-error"
                  maxlength="15"
                />
                <div class="field-error" th:errors="*{city}" />
              </div>

              <div class="col-12">
                <label for="password" class="form-label">비밀번호</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  th:field="*{password}"
                  placeholder=""
                  th:errorclass="field-error"
                  maxlength="15"
                />
                <div class="field-error" th:errors="*{password}" />
              </div>
            </div>

            <hr class="my-4" />
            <button class="w-100 btn btn-primary btn-lg" type="submit">
              회원가입
            </button>
          </form>
        </div>
      </div>
    </div>
    <div th:replace="fragments/footer :: footer"></div>
  </body>
  <script>
    const previewImage = document.getElementById("previewImage");
    const memberImage = document.getElementById("memberImage"); // Assuming your file input has this ID

    function previewImageFuc(event) {
      console.log("D");
      const reader = new FileReader();
      reader.onload = function () {
        previewImage.src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    memberImage.addEventListener("change", previewImageFuc);
  </script>
</html>
