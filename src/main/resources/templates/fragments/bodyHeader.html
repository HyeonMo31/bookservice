<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  >
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
  </head>
  <body>
    <div class="container" th:fragment="bodyHeader">
      <header
        class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom"
      >
        <div class="col-md-4 mb-2 mb-md-0">
          <a
            th:href="@{/}"
            class="d-inline-flex link-body-emphasis text-decoration-none"
          >
            <img src="/../img/tuna-head.jpg" width="50" height="42" />
          </a>
        </div>

        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
          <li><a th:href="@{/}" class="nav-link px-2 link-secondary">홈</a></li>
          <li><a th:href="@{/search}" class="nav-link px-2">검색</a></li>
          <li>
            <a th:href="@{/post}" class="nav-link px-2">토론</a>
          </li>
        </ul>

        <div sec:authorize="isAnonymous()" class="col-md-4 text-end">
          <button
            th:onclick="|location.href='@{/login}'|"
            type="button"
            class="btn btn-outline-primary me-2"
          >
            로그인
          </button>
          <button
            th:onclick="|location.href='@{/join}'|"
            type="button"
            class="btn btn-primary"
          >
            회원가입
          </button>
        </div>
        <div
          sec:authorize="isAuthenticated()"
          class="col-md-4 text-end d-flex justify-content-end"
        >
          <div
            sec:authorize="isAuthenticated()"
            th:text="${#authentication.principal.member.name} + '님 반갑습니다.'"
            class="fw-bold d-flex align-items-center mx-1"
          ></div>
          <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-primary me-2">
              로그아웃
            </button>
          </form>
          <button
            th:onclick="|location.href='@{/my-page}'|"
            type="button"
            class="btn btn-primary"
          >
            마이페이지
          </button>
        </div>
      </header>
    </div>
  </body>
</html>
